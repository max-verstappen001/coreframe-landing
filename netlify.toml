[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Keep the apex HTTPS origin as the single public host. Netlify preserves the
# path and query string for splat redirects.
[[redirects]]
  from = "https://www.coreframetech.in/*"
  to = "https://coreframetech.in/:splat"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Regional deployments are separate sites, built from the same repository.
# Set NEXT_PUBLIC_SITE_REGION=global or uae in each site's build environment.
# Do not attach both regional apex domains to one Netlify site.
[[redirects]]
  from = "https://www.coreframe.ae/*"
  to = "https://coreframe.ae/:splat"
  status = 301
  force = true
